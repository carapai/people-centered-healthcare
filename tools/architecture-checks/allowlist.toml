# Policy read by tools/architecture-checks (docs/architecture/dependency-rules.md).
# Changing this file is reviewed like an ADR.

# External crates a domain crate may use (rule 5). The time crate is jiff.
domain-externals = ["serde", "thiserror", "rust_decimal", "uuid", "jiff", "tracing"]

# Externals rule 5 names as forbidden in domain crates; listed so failures say so.
domain-forbidden = [
    "tokio",
    "axum",
    "tower",
    "surrealdb",
    "reqwest",
    "tauri",
    "tracing-subscriber",
    "opentelemetry",
    "anyhow",
]

# Crates allowed not to inherit [workspace.lints].
lint-exempt = []

# External crates only their facade may depend on (ADR 0050; ADR 0015: domain code imports only
# the facade, so a crate swap stays inside it).
[facades]
fhir-r5 = "health-fhir-models"
fhir-r4 = "health-fhir-mapping"
