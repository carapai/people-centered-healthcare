# Prometheus (#139): the span metrics the collector writes (remote write receiver), and the
# stack's own health.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: observability
    static_configs:
      - targets: [prometheus:9090, loki:3100, tempo:3200, alertmanager:9093, otel-collector:8888]
