# Generated from alerts.tsv (#139): one rule per alert code the nodes emit. A rule fires while
# the code has been raised and not cleared within the last 24 hours, per node and per subject
# (`check`: a volume or a task), from the log records alone. Telemetry carries no personal data:
# only the allowlisted fields reach these logs (deployment.md § Observability).
groups:
  - name: finance
    interval: 1m
    rules:
      - alert: PaymentException
        expr: |
          (
            sum by (service_name, service_instance_id, check) (count_over_time({service_name=~".+"} | alert="payment-exception" | outcome!="cleared" [24h]))
            -
            (sum by (service_name, service_instance_id, check) (count_over_time({service_name=~".+"} | alert="payment-exception" | outcome="cleared" [24h])) or sum by (service_name, service_instance_id, check) (count_over_time({service_name=~".+"} | alert="payment-exception" | outcome!="cleared" [24h])) * 0)
          ) > 0
        for: 1m
        labels:
          severity: warning
          area: finance
          code: payment-exception
        annotations:
          summary: "A payment needs a person (exceptions queue)"
          description: "{{ $labels.service_name }} {{ $labels.service_instance_id }}: A payment needs a person (exceptions queue) (payment-exception)."
      - alert: MomoAmountMismatch
        expr: |
          (
            sum by (service_name, service_instance_id, check) (count_over_time({service_name=~".+"} | alert="momo-amount-mismatch" | outcome!="cleared" [24h]))
            -
            (sum by (service_name, service_instance_id, check) (count_over_time({service_name=~".+"} | alert="momo-amount-mismatch" | outcome="cleared" [24h])) or sum by (service_name, service_instance_id, check) (count_over_time({service_name=~".+"} | alert="momo-amount-mismatch" | outcome!="cleared" [24h])) * 0)
          ) > 0
        for: 1m
        labels:
          severity: warning
          area: finance
          code: momo-amount-mismatch
        annotations:
          summary: "MTN confirmed another amount than recorded"
          description: "{{ $labels.service_name }} {{ $labels.service_instance_id }}: MTN confirmed another amount than recorded (momo-amount-mismatch)."
      - alert: MomoOff
        expr: |
          (
            sum by (service_name, service_instance_id, check) (count_over_time({service_name=~".+"} | alert="momo-off" | outcome!="cleared" [24h]))
            -
            (sum by (service_name, service_instance_id, check) (count_over_time({service_name=~".+"} | alert="momo-off" | outcome="cleared" [24h])) or sum by (service_name, service_instance_id, check) (count_over_time({service_name=~".+"} | alert="momo-off" | outcome!="cleared" [24h])) * 0)
          ) > 0
        for: 1m
        labels:
          severity: critical
          area: finance
          code: momo-off
        annotations:
          summary: "MTN MoMo collections are off"
          description: "{{ $labels.service_name }} {{ $labels.service_instance_id }}: MTN MoMo collections are off (momo-off)."
      - alert: PaymentsOff
        expr: |
          (
            sum by (service_name, service_instance_id, check) (count_over_time({service_name=~".+"} | alert="payments-off" | outcome!="cleared" [24h]))
            -
            (sum by (service_name, service_instance_id, check) (count_over_time({service_name=~".+"} | alert="payments-off" | outcome="cleared" [24h])) or sum by (service_name, service_instance_id, check) (count_over_time({service_name=~".+"} | alert="payments-off" | outcome!="cleared" [24h])) * 0)
          ) > 0
        for: 1m
        labels:
          severity: warning
          area: finance
          code: payments-off
        annotations:
          summary: "Payments are configured but cannot run"
          description: "{{ $labels.service_name }} {{ $labels.service_instance_id }}: Payments are configured but cannot run (payments-off)."
