# Loki for the platform's logs (#139): OTLP ingestion from the collector, and the ruler that
# evaluates loki/rules and sends alerts to Alertmanager. Single binary, filesystem storage, for
# staging; production sizing and retention are set when the in-country site is stood up.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  # Logs are kept 90 days, as the inbound dead letter is (ADR 0051), unless operations decide.
  retention_period: 2160h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

ruler:
  storage:
    type: local
    local:
      directory: /etc/loki/rules
  rule_path: /loki/rules-temp
  alertmanager_url: http://alertmanager:9093
  enable_api: true
  enable_alertmanager_v2: true
