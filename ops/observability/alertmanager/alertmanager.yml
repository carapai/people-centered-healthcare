# Alert routing (#139): every alert goes to central operations (deployment.md § Observability).
# The receiver below is a placeholder: replace its URL with operations' paging or chat webhook
# when the in-country site is stood up (Alertmanager does not read the environment).
route:
  receiver: central-operations
  group_by: [alertname, service_instance_id]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: central-operations
      repeat_interval: 1h
    - matchers: [severity="info"]
      receiver: central-operations
      repeat_interval: 24h

receivers:
  - name: central-operations
    webhook_configs:
      - url: http://ops-webhook.invalid/alerts
        send_resolved: true

inhibit_rules:
  # A node with no backups configured need not also page for a stale backup.
  - source_matchers: [code="backups-off"]
    target_matchers: [code="backup-stale"]
    equal: [service_instance_id]
