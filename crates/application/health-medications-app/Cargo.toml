[package]
name = "health-medications-app"
description = "Prescribing at the facility authority (#108): prescriptions as FHIR MedicationRequests, written after the clinical safety checks are acknowledged, each with its outbox event, and never touching stock."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.health]
layer = "application"
context = "medications"

[lints]
workspace = true

[dependencies]
health-access-policy = { workspace = true }
health-identifiers = { workspace = true }
health-medications = { workspace = true }
health-persistence = { workspace = true }
health-time = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
health-fhir-validation = { workspace = true }
health-surrealdb = { workspace = true }
surrealdb = { workspace = true, features = ["kv-mem"] }
tokio = { workspace = true }
