[package]
name = "health-analytics-app"
description = "Indicators evaluated (analytics.md; ADR 0068; #548): a FHIR R5 Measure read as an indicator, and its FHIRPath criteria evaluated over each patient's records for one reporting period: counts, percentages, rates, ratios and summarised values."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.health]
layer = "application"
context = "analytics"

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
health-analytics = { workspace = true }
health-fhir-validation = { workspace = true }
health-persistence = { workspace = true }
jiff = { workspace = true }
rust_decimal = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
health-identifiers = { workspace = true }
health-surrealdb = { workspace = true, features = ["memory"] }
health-time = { workspace = true }
tokio = { workspace = true }
