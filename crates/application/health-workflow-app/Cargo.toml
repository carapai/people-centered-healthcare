[package]
name = "health-workflow-app"
description = "The workflow application: runs workflow instances, appending their history, with user commands in one transaction and domain events through a deduplicating inbox (workflow-engine.md § Persistence and transactions; ADR 0044)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.health]
layer = "application"
context = "workflow"

[lints]
workspace = true

[dependencies]
health-billing-contract = { workspace = true }
health-identifiers = { workspace = true }
health-persistence = { workspace = true }
health-time = { workspace = true }
health-workflow = { workspace = true }
health-workflow-actions = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
health-fhir-validation = { workspace = true }
health-identifiers = { workspace = true }
health-surrealdb = { workspace = true }
health-sync-protocol = { workspace = true }
surrealdb = { workspace = true, features = ["kv-mem"] }
tokio = { workspace = true }
uuid = { workspace = true }
