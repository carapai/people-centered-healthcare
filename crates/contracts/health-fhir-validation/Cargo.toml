[package]
name = "health-fhir-validation"
description = "FHIR R5 validation: tier 1 structure on raw JSON (ADR 0051), and later invariants, profiles and bindings (ADR 0016)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.health]
layer = "contracts"

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
octofhir-fhirpath = { workspace = true }
regex = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt"] }

[dev-dependencies]
health-fhir-models = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt-multi-thread", "macros"] }
