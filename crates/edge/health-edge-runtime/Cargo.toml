[package]
name = "health-edge-runtime"
description = "The Facility Edge Node's runtime: the embedded store, the startup and stop sequence, the embedded web app, scheduled backups, health monitoring and the telemetry buffer, service-manager notifications, supervised tasks and the UPS watch (facility-edge.md, ADR 0007)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.health]
layer = "runtime"

[lints]
workspace = true

[dependencies]
axum = { workspace = true }
flate2 = { workspace = true }
fs4 = { workspace = true }
health-auth = { workspace = true }
health-backup = { workspace = true }
health-files = { workspace = true }
health-http = { workspace = true }
health-identity = { workspace = true }
health-observability = { workspace = true }
health-pki = { workspace = true }
health-identifiers = { workspace = true }
health-provisioning = { workspace = true }
health-sync-protocol = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-rustls = { workspace = true }
hyper-util = { workspace = true }
health-surrealdb = { workspace = true, features = ["embedded"] }
health-time = { workspace = true }
if-addrs = { workspace = true }
mdns-sd = { workspace = true }
p256 = { workspace = true, features = ["pkcs8", "pem"] }
reqwest = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "signal", "sync"] }
tokio-rustls = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-service = { workspace = true }

[dev-dependencies]
health-persistence = { workspace = true }
health-surrealdb = { workspace = true, features = ["embedded", "memory"] }
health-sync-server = { workspace = true }
rcgen = { workspace = true }
