[package]
name = "health-activation"
description = "Package activation on a node (#89; configuration.md § Distribution and activation on nodes; ADR 0025): staging verified packages, the switch to the active set, and the definitions central serves from it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.health]
layer = "infrastructure"

[lints]
workspace = true

[dependencies]
health-configuration = { workspace = true }
health-fhir-validation = { workspace = true }
health-files = { workspace = true }
health-identifiers = { workspace = true }
health-packages = { workspace = true }
health-persistence = { workspace = true }
health-pki = { workspace = true }
health-surrealdb = { workspace = true }
health-time = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
health-surrealdb = { workspace = true, features = ["embedded", "memory"] }
tempfile = { workspace = true }
