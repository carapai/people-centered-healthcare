[package]
name = "health-fhir-server"
description = "FHIR R5 REST handlers, CapabilityStatement and Bundle assembly over the SurrealDB store (persistence.md § REST semantics)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.health]
layer = "infrastructure"

[lints]
workspace = true

[dependencies]
axum = { workspace = true, features = ["query", "form"] }
form_urlencoded = { workspace = true }
health-access-policy = { workspace = true }
health-audit = { workspace = true }
health-fhir-search = { workspace = true }
health-fhir-validation = { workspace = true }
health-identifiers = { workspace = true }
health-identity-app = { workspace = true }
health-persistence = { workspace = true }
health-surrealdb = { workspace = true }
health-time = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
http-body-util = { workspace = true }
jiff = { workspace = true }
surrealdb = { workspace = true, features = ["kv-mem"] }
# The contract server (examples/contract_server.rs) listens on TCP.
tokio = { workspace = true, features = ["net"] }
tower = { workspace = true }
