[package]
name = "health-surrealdb"
description = "SurrealDB adapter: connections, migrations, and (from #56) the unit of work and repositories (ADRs 0017-0018)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.health]
layer = "infrastructure"

[lints]
workspace = true

[features]
# Adapters are chosen per runtime (dependency-rules.md rule 6): the edge and desktop embed RocksDB,
# central connects to a server, and tests use the in-memory engine.
embedded = ["surrealdb/kv-rocksdb"]
remote = ["surrealdb/protocol-ws", "surrealdb/rustls"]
memory = ["surrealdb/kv-mem"]

[dependencies]
health-identifiers = { workspace = true }
health-persistence = { workspace = true }
health-time = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
surrealdb = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
surrealdb = { workspace = true, features = ["kv-mem"] }
tokio = { workspace = true }
