[package]
name = "health-auth"
description = "The OIDC / SMART App Launch v2 authorization server: authorization code with PKCE, DPoP-bound ES256 tokens, refresh, revocation and Argon2id credentials (offline-auth.md, ADR 0010)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.health]
layer = "infrastructure"

[lints]
workspace = true

[dependencies]
argon2 = { workspace = true }
axum = { workspace = true, features = ["form", "original-uri", "query"] }
base64 = { workspace = true }
chacha20poly1305 = { workspace = true }
form_urlencoded = { workspace = true }
health-access-policy = { workspace = true }
hkdf = { workspace = true }
health-audit = { workspace = true }
health-consent = { workspace = true }
health-http = { workspace = true }
health-identity = { workspace = true }
health-identity-app = { workspace = true }
health-persistence = { workspace = true }
health-surrealdb = { workspace = true }
health-time = { workspace = true }
jiff = { workspace = true }
p256 = { workspace = true, features = ["ecdh", "pkcs8", "pem"] }
rand_core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sha2-010 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
health-pki = { workspace = true }
health-identifiers = { workspace = true }
jiff = { workspace = true }
surrealdb = { workspace = true, features = ["kv-mem"] }
health-fhir-search = { workspace = true }
http-body-util = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
