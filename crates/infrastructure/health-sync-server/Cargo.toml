[package]
name = "health-sync-server"
description = "The /sync/v1 endpoints a node serves its downstream peers (synchronization.md; ADR 0062): handshake, push, pull and cursor hints, each request signed by the calling node."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.health]
layer = "infrastructure"

[lints]
workspace = true

[dependencies]
axum = { workspace = true }
health-access-policy = { workspace = true }
health-audit = { workspace = true }
health-auth = { workspace = true }
health-files = { workspace = true }
health-http = { workspace = true }
health-persistence = { workspace = true }
health-time = { workspace = true }
futures-util = { workspace = true }
health-identifiers = { workspace = true }
health-provisioning = { workspace = true }
health-surrealdb = { workspace = true }
health-sync-protocol = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
health-identity = { workspace = true }
health-pki = { workspace = true }
http-body-util = { workspace = true }
p256 = { workspace = true }
surrealdb = { workspace = true, features = ["kv-mem"] }
tower = { workspace = true }
