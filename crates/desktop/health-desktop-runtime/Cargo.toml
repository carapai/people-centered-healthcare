[package]
name = "health-desktop-runtime"
description = "The Tauri desktop client's runtime (desktop-client.md; ADRs 0036, 0039, 0040): the IPC dispatch into the shared router, the per-machine data directory and the OS keystore port."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.health]
layer = "runtime"

[lints]
workspace = true

[dependencies]
axum = { workspace = true }
form_urlencoded = { workspace = true }
http-body-util = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tower = { workspace = true }

[dev-dependencies]
health-fhir-search = { workspace = true }
health-fhir-server = { workspace = true }
health-surrealdb = { workspace = true, features = ["memory"] }
health-time = { workspace = true }
jiff = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
