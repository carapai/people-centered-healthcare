[workspace]
resolver = "3"
members = [
    "crates/foundation/health-errors",
    "crates/foundation/health-identifiers",
    "crates/foundation/health-time",
    "crates/contracts/health-fhir-models",
    "crates/contracts/health-fhir-search",
    "crates/contracts/health-fhir-validation",
    "crates/contracts/health-persistence",
    "crates/domains/health-access-policy",
    "crates/domains/health-client-registry",
    "crates/domains/health-identity",
    "crates/application/health-identity-app",
    "crates/application/health-registries-app",
    "crates/infrastructure/health-audit",
    "crates/infrastructure/health-auth",
    "crates/infrastructure/health-fhir-server",
    "crates/infrastructure/health-files",
    "crates/infrastructure/health-http",
    "crates/infrastructure/health-integration",
    "crates/infrastructure/health-observability",
    "crates/infrastructure/health-surrealdb",
    "crates/testing/health-persistence-memory",
    "apps/server/central-server",
    "tools/architecture-checks",
    "tools/fhir-element-table",
    "tools/synthetic-data",
]
# Vendored upstream crates are path dependencies through [patch.crates-io], not members.
exclude = ["third_party"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

# Every crate, workspace or external, is declared here once; members use `{ workspace = true }`.
[workspace.dependencies]
health-access-policy = { path = "crates/domains/health-access-policy" }
health-audit = { path = "crates/infrastructure/health-audit" }
health-auth = { path = "crates/infrastructure/health-auth" }
health-client-registry = { path = "crates/domains/health-client-registry" }
health-fhir-server = { path = "crates/infrastructure/health-fhir-server" }
health-fhir-models = { path = "crates/contracts/health-fhir-models" }
health-fhir-search = { path = "crates/contracts/health-fhir-search" }
health-http = { path = "crates/infrastructure/health-http" }
health-integration = { path = "crates/infrastructure/health-integration" }
health-fhir-validation = { path = "crates/contracts/health-fhir-validation" }
health-files = { path = "crates/infrastructure/health-files" }
health-identifiers = { path = "crates/foundation/health-identifiers" }
health-identity = { path = "crates/domains/health-identity" }
health-identity-app = { path = "crates/application/health-identity-app" }
health-observability = { path = "crates/infrastructure/health-observability" }
health-persistence = { path = "crates/contracts/health-persistence" }
health-persistence-memory = { path = "crates/testing/health-persistence-memory" }
health-surrealdb = { path = "crates/infrastructure/health-surrealdb" }
health-time = { path = "crates/foundation/health-time" }

anyhow = "1.0.104"
argon2 = { version = "0.5.3", features = ["std"] }
async-trait = "0.1.92"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "matched-path", "tokio"] }
base64 = "0.22.1"
cargo_metadata = "0.23.1"
# The adopted R5 model crate, exactly pinned (ADR 0050); only health-fhir-models may use it.
fhir-r5 = "=4.2.3"
form_urlencoded = "1.2.2"
http-body-util = "0.1.3"
jiff = { version = "0.2.38", features = ["serde"] }
# Patched for decimal-exact evaluation (ADR 0052); see third_party/octofhir-fhirpath.
octofhir-fhirpath = "=0.4.57"
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace"] }
p256 = { version = "0.13.2", features = ["ecdsa", "jwk"] }
pollster = "1.0.1"
rand_core = { version = "0.6.4", features = ["getrandom"] }
regex = "1.13.1"
rust_decimal = "1.43.0"
reqwest = { version = "0.13.5", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
# Decimals keep their source text and objects keep key order (ADRs 0051, 0052).
serde_json = { version = "1.0.154", features = ["arbitrary_precision", "preserve_order"] }
# The exact 3.3.x pin shared by every runtime (persistence.md § Engine, version and process).
surrealdb = { version = "=3.3.5", default-features = false }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
toml = "1.1.8"
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "registry", "env-filter"] }
unicode-normalization = "0.1.26"
uuid = { version = "1.29.0", features = ["serde", "v5", "v7"] }
utoipa = { version = "6.0.0", default-features = false, features = ["macros"] }
utoipa-axum = "0.3.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
print_stdout = "warn"

[patch.crates-io]
# ADR 0052: the decimal-exact fork, vendored with its patches listed in PATCHES.md.
octofhir-fhirpath = { path = "third_party/octofhir-fhirpath" }
# A dependency of octofhir-fhirpath; patched so non-ASCII unit codes cannot panic.
octofhir-ucum = { path = "third_party/octofhir-ucum" }
