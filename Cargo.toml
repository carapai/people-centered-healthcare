[workspace]
resolver = "3"
members = [
    "crates/foundation/health-errors",
    "crates/foundation/health-identifiers",
    "crates/foundation/health-time",
    "crates/contracts/health-fhir-models",
    "crates/contracts/health-fhir-search",
    "crates/contracts/health-fhir-validation",
    "crates/contracts/health-persistence",
    "crates/contracts/health-workflow-actions",
    "crates/domains/health-access-policy",
    "crates/domains/health-client-registry",
    "crates/domains/health-configuration",
    "crates/domains/health-consent",
    "crates/domains/health-financial-ledger",
    "crates/domains/health-identity",
    "crates/domains/health-inventory",
    "crates/domains/health-patient-engagement",
    "crates/domains/health-payments",
    "crates/domains/health-workflow",
    "crates/domains/health-terminology",
    "crates/application/health-identity-app",
    "crates/application/health-inventory-app",
    "crates/application/health-patient-engagement-app",
    "crates/application/health-payments-app",
    "crates/application/health-registries-app",
    "crates/infrastructure/health-audit",
    "crates/infrastructure/health-auth",
    "crates/infrastructure/health-backup",
    "crates/infrastructure/health-fhir-server",
    "crates/infrastructure/health-files",
    "crates/infrastructure/health-http",
    "crates/infrastructure/health-integration",
    "crates/infrastructure/health-observability",
    "crates/infrastructure/health-packages",
    "crates/infrastructure/health-pki",
    "crates/infrastructure/health-provisioning",
    "crates/infrastructure/health-publication",
    "crates/infrastructure/health-surrealdb",
    "crates/testing/health-persistence-memory",
    "crates/edge/health-edge-runtime",
    "crates/edge/health-node-identity",
    "apps/server/central-server",
    "apps/server/facility-edge",
    "tools/architecture-checks",
    "tools/fhir-element-table",
    "tools/pki",
    "tools/synthetic-data",
]
# Vendored upstream crates are path dependencies through [patch.crates-io], not members.
exclude = ["third_party"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

# Every crate, workspace or external, is declared here once; members use `{ workspace = true }`.
[workspace.dependencies]
health-access-policy = { path = "crates/domains/health-access-policy" }
health-audit = { path = "crates/infrastructure/health-audit" }
health-auth = { path = "crates/infrastructure/health-auth" }
health-backup = { path = "crates/infrastructure/health-backup" }
health-client-registry = { path = "crates/domains/health-client-registry" }
health-consent = { path = "crates/domains/health-consent" }
health-edge-runtime = { path = "crates/edge/health-edge-runtime" }
health-fhir-server = { path = "crates/infrastructure/health-fhir-server" }
health-fhir-models = { path = "crates/contracts/health-fhir-models" }
health-fhir-search = { path = "crates/contracts/health-fhir-search" }
health-http = { path = "crates/infrastructure/health-http" }
health-integration = { path = "crates/infrastructure/health-integration" }
health-fhir-validation = { path = "crates/contracts/health-fhir-validation" }
health-files = { path = "crates/infrastructure/health-files" }
health-identifiers = { path = "crates/foundation/health-identifiers" }
health-financial-ledger = { path = "crates/domains/health-financial-ledger" }
health-node-identity = { path = "crates/edge/health-node-identity" }
health-configuration = { path = "crates/domains/health-configuration" }
health-terminology = { path = "crates/domains/health-terminology" }
health-workflow-actions = { path = "crates/contracts/health-workflow-actions" }
health-identity = { path = "crates/domains/health-identity" }
health-inventory = { path = "crates/domains/health-inventory" }
health-patient-engagement = { path = "crates/domains/health-patient-engagement" }
health-payments = { path = "crates/domains/health-payments" }
health-workflow = { path = "crates/domains/health-workflow" }
health-identity-app = { path = "crates/application/health-identity-app" }
health-inventory-app = { path = "crates/application/health-inventory-app" }
health-patient-engagement-app = { path = "crates/application/health-patient-engagement-app" }
health-payments-app = { path = "crates/application/health-payments-app" }
health-observability = { path = "crates/infrastructure/health-observability" }
health-persistence = { path = "crates/contracts/health-persistence" }
health-packages = { path = "crates/infrastructure/health-packages" }
health-pki = { path = "crates/infrastructure/health-pki" }
health-provisioning = { path = "crates/infrastructure/health-provisioning" }
health-publication = { path = "crates/infrastructure/health-publication" }
health-persistence-memory = { path = "crates/testing/health-persistence-memory" }
health-registries-app = { path = "crates/application/health-registries-app" }
health-surrealdb = { path = "crates/infrastructure/health-surrealdb" }
health-time = { path = "crates/foundation/health-time" }
synthetic-data = { path = "tools/synthetic-data" }

anyhow = "1.0.104"
argon2 = { version = "0.5.3", features = ["std"] }
async-trait = "0.1.92"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "matched-path", "tokio"] }
base64 = "0.22.1"
cargo_metadata = "0.23.1"
chacha20poly1305 = "0.10.1"
# The adopted R5 model crate, exactly pinned (ADR 0050); only health-fhir-models may use it.
fhir-r5 = "=4.2.3"
form_urlencoded = "1.2.2"
futures-util = { version = "0.3.34", default-features = false }
http-body-util = "0.1.3"
# The edge's one HTTPS call to central, at provisioning (#268): central verified against the OS
# trust store (rustls-native-certs), never a bundled one, on the ring provider.
hyper = { version = "1.12.0", default-features = false, features = ["client", "http1"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "tls12", "ring", "native-tokio", "logging"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["client-legacy", "http1", "tokio"] }
flate2 = "1.1.2"
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }
jiff = { version = "0.2.38", features = ["serde"] }
jsonschema = { version = "0.60.2", default-features = false, features = ["arbitrary-precision"] }
# Patched for decimal-exact evaluation (ADR 0052); see third_party/octofhir-fhirpath.
octofhir-fhirpath = "=0.4.57"
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace"] }
# The provisioning bundle's key derivation (ADR 0059): HKDF-SHA-256 over p256's ECDH, which is
# on sha2 0.10 (p256 0.13).
hkdf = "0.12.4"
sha2-010 = { package = "sha2", version = "0.10.9" }
# The edge's private LAN addresses, for its leaf certificate.
if-addrs = "0.15.0"
# The edge's `_health-edge._tcp` mDNS hint for LAN clients (lan-security.md § Addressing).
mdns-sd = { version = "0.21.7", default-features = false }
p256 = { version = "0.13.2", features = ["ecdsa", "jwk"] }
pollster = "1.0.1"
# Certificates and CRLs for the private PKI (ADRs 0008, 0058), on ring like rustls.
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring", "pem", "x509-parser"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
regex = "1.13.1"
rustls-pki-types = { version = "1.15.1", features = ["std"] }
rustls-webpki = { version = "0.103.16", default-features = false, features = ["std", "ring"] }
rust_decimal = "1.43.0"
# The edge serves the LAN over TLS with its own leaf (lan-security.md), on ring like rcgen.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
reqwest = { version = "0.13.5", default-features = false }
rphonetic = { version = "4.0.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
# Decimals keep their source text and objects keep key order (ADRs 0051, 0052).
serde_json = { version = "1.0.154", features = ["arbitrary_precision", "preserve_order"] }
# The exact 3.3.x pin shared by every runtime (persistence.md § Engine, version and process).
surrealdb = { version = "=3.3.5", default-features = false }
time = { version = "0.3.55", default-features = false, features = ["std"] }
tempfile = "3.27.0"
tar = { version = "0.4.44", default-features = false }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
toml = "1.1.8"
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "registry", "env-filter"] }
unicode-normalization = "0.1.26"
windows-service = "0.8.0"
# Reads the PKI's own certificates back: path length, names and validity (health-pki).
x509-parser = "0.18.1"
uuid = { version = "1.29.0", features = ["serde", "v5", "v7"] }
utoipa = { version = "6.0.0", default-features = false, features = ["macros"] }
utoipa-axum = "0.3.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
print_stdout = "warn"

[patch.crates-io]
# ADR 0052: the decimal-exact fork, vendored with its patches listed in PATCHES.md.
octofhir-fhirpath = { path = "third_party/octofhir-fhirpath" }
# A dependency of octofhir-fhirpath; patched so non-ASCII unit codes cannot panic.
octofhir-ucum = { path = "third_party/octofhir-ucum" }

# Packing, unpacking and hashing an update package is slow unoptimized, and tests package the
# (large) debug binary.
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.adler2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
