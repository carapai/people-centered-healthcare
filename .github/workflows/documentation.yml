# Documentation checks (deployment.md § Workflows).
name: documentation

# No path filter: its jobs are required checks, and a filtered-out workflow never reports.
on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  markdown:
    name: markdownlint, ADR index, Mermaid
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bunx markdownlint-cli2@0.18.1
      - run: tools/docs/check-adr-index.sh
      - name: Render the Mermaid diagrams
        run: |
          bun add --global @mermaid-js/mermaid-cli@12.0.0
          tools/docs/render-mermaid.sh

  links:
    name: lychee
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml --no-progress "./**/*.md"
          fail: true

  surrealql:
    name: surreal validate, surql-fmt
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the base branch, to find the migrations this PR adds
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install SurrealDB 4.0.0 (the pinned server version)
        run: |
          curl --fail --silent --show-error --location --output surreal.tgz \
            https://download.surrealdb.com/v4.0.0/surreal-v4.0.0.linux-amd64.tgz
          echo "e910760179b9f13d0773ce98ac50f9a537051156365239284c2dc687adf3049d  surreal.tgz" | sha256sum --check
          tar -xzf surreal.tgz
          ./surreal version
      - run: git ls-files '*.surql' | xargs ./surreal validate
      # An applied migration is immutable: the runner records its SHA-256 and refuses a changed
      # file. So migrations are checked when a PR adds them, and never reformatted afterwards.
      - name: surql-fmt --check (with the diff for any unformatted file)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          {
            git ls-files '*.surql' | grep -v '/migrations/' || true
            if [[ -n "$BASE_REF" ]]; then
              git diff --name-only --diff-filter=A "origin/$BASE_REF...HEAD" -- '*/migrations/*.surql'
            fi
          } > formatted.txt
          status=0
          while IFS= read -r file; do
            if ! bunx @surrealdb/surql-fmt@0.1.0-beta.3 --check "$file"; then
              bunx @surrealdb/surql-fmt@0.1.0-beta.3 "$file" | diff -u "$file" - || true
              status=1
            fi
          done < formatted.txt
          exit $status
