# Rust checks (deployment.md § Workflows; ADR 0045).
name: rust-ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt, clippy, doc, architecture, deny
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-deny
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo run --locked --quiet -p architecture-checks
      - run: cargo deny --locked check

  test:
    name: build, nextest, doc tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      # Full debug info for every test binary (SurrealDB, RocksDB) fills the runner's disk and
      # the linker dies; line tables keep backtraces.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest
      - run: cargo build --workspace --all-targets --locked
      - run: cargo nextest run --workspace --locked --no-tests=pass
      - run: cargo test --workspace --doc --locked
      - if: always()
        run: df -h . && du -sh target

  fhir-corpus:
    name: FHIR corpus, element table, validation budget
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      # Absolute: each crate's tests run from the crate's own directory.
      HEALTH_FHIR_R5_EXAMPLES: ${{ github.workspace }}/target/fhir/r5-examples/json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Fetch the R5 core package and examples (checksum-verified)
        run: |
          tools/fhir/fetch-r5-core.sh
          tools/fhir/fetch-r5-examples.sh
      - run: tools/fhir/check-element-table.sh target/fhir/r5-core/package
      # Release build: the corpus tests are slow in debug, and the budget applies to release.
      - run: cargo test --release --locked -p health-fhir-models -p health-fhir-validation

  coverage:
    name: coverage ≥ 80% lines (domain and application crates)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - name: Measure the domain and application crates
        run: |
          packages=$(cargo metadata --format-version 1 --no-deps --locked \
            | jq -r '.packages[] | select(.metadata.health.layer == "domain" or .metadata.health.layer == "application") | "--package=" + .name')
          status=0
          # shellcheck disable=SC2086 # one argument per package
          cargo llvm-cov nextest --locked --no-tests=pass $packages --fail-under-lines 80 2> coverage.err || status=$?
          cat coverage.err >&2
          if [[ $status != 0 ]]; then
            # Crates that are still empty stubs have no instrumented code at all; that is not a
            # coverage failure. Code without tests reports 0% and fails above.
            grep -q "no coverage data found" coverage.err || exit 1
            echo "::notice::the domain and application crates have no code yet; nothing to measure"
          fi

  java-differential:
    name: HL7 Java validator differential
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      # The FHIR packages the validator loads (core, terminology, extensions), keyed on its
      # version.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.fhir/packages
          key: fhir-packages-${{ hashFiles('tools/fhir/fetch-java-validator.sh') }}
      - run: tools/fhir/fetch-r5-examples.sh
      - run: tools/fhir/java-differential.sh target/fhir/r5-examples/json
