# Rust checks (deployment.md § Workflows; ADR 0045).
name: rust-ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

# Cargo caches use actions/cache (MIT), keyed per job on the toolchain and Cargo.lock;
# Swatinem/rust-cache is LGPL-3.0, which ADR 0045's licence allowlist excludes. As rust-cache
# does, every run restores and only main saves, after tools/github/prune-target.sh leaves just the
# dependencies: PR caches would evict main's from the 10 GB the repository is allowed.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Incremental artefacts only bloat a CI cache.
  CARGO_INCREMENTAL: 0
  # Line tables keep backtraces; full debug info for every test binary (SurrealDB, RocksDB)
  # fills the runner's disk, slows linking and swells the cache.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  lint:
    name: fmt, clippy, doc, architecture, deny
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-deny
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Rustdoc merges each crate into the shared search and impl indexes one crate at a time.
      # health-fhir-models' docs (the generated R5 model, ~100 MB) made every later merge slow:
      # 47 min for the workspace. Documented last, its indexes are merged once.
      - run: cargo doc --workspace --exclude health-fhir-models --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo doc -p health-fhir-models --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo run --locked --quiet -p architecture-checks
      - run: cargo deny --locked check
      # Only main saves (a push or the nightly run), and only a cache it did not restore exactly:
      # PRs restore it and never evict it. Pruned first, it holds the dependencies, which change
      # only with the toolchain and Cargo.lock (tools/github/prune-target.sh).
      - if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        shell: bash
        run: tools/github/prune-target.sh
      - if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

  test:
    name: build, nextest, doc tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      # Every test binary links SurrealDB and RocksDB; even line tables take the workspace's
      # target/ past 40 GB, more than some runners have free. Assertion failures keep their file
      # and line without debug info.
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      # The runner's preinstalled toolchains that no step here uses (about 25 GB): runners of the
      # same image come with different free space, and the linker fails on the smaller ones.
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Dependencies optimized, the workspace's own crates not: the tests spend their time in
      # SurrealDB, which is ~20x faster optimized (the registries match test: 605 s -> 31 s).
      # The dependencies are cached with Cargo.lock, so only a dependency change rebuilds them;
      # the cache key names the profile so a debug-dependency cache is never restored.
      - name: optimize dependencies
        run: printf '\n[profile.dev.package."*"]\nopt-level = 2\n' >> .cargo/config.toml
      - id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ github.job }}-deps-o2-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-deps-o2-
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest
      - run: cargo build --workspace --all-targets --locked
      - run: cargo nextest run --workspace --locked --no-tests=pass
      - run: cargo test --workspace --doc --locked
      - if: always()
        run: df -h . && du -sh target
      # Only main saves (a push or the nightly run), and only a cache it did not restore exactly:
      # PRs restore it and never evict it. Pruned first, it holds the dependencies, which change
      # only with the toolchain and Cargo.lock (tools/github/prune-target.sh).
      - if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        shell: bash
        run: tools/github/prune-target.sh
      - if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ github.job }}-deps-o2-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

  fhir-corpus:
    name: FHIR corpus, element table, validation budget
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      # Absolute: each crate's tests run from the crate's own directory.
      HEALTH_FHIR_R5_EXAMPLES: ${{ github.workspace }}/target/fhir/r5-examples/json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - name: Fetch the R5 core package and examples (checksum-verified)
        run: |
          tools/fhir/fetch-r5-core.sh
          tools/fhir/fetch-r5-examples.sh
      - run: tools/fhir/check-element-table.sh target/fhir/r5-core/package
      # Release build: the corpus tests are slow in debug, and the budget applies to release.
      - run: cargo test --release --locked -p health-fhir-models -p health-fhir-validation
      # Only main saves (a push or the nightly run), and only a cache it did not restore exactly:
      # PRs restore it and never evict it. Pruned first, it holds the dependencies, which change
      # only with the toolchain and Cargo.lock (tools/github/prune-target.sh).
      - if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        shell: bash
        run: tools/github/prune-target.sh
      - if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

  coverage:
    name: coverage ≥ 80% lines (domain and application crates)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup component add llvm-tools-preview
      - id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - name: Measure the domain and application crates
        run: |
          packages=$(cargo metadata --format-version 1 --no-deps --locked \
            | jq -r '.packages[] | select(.metadata.health.layer == "domain" or .metadata.health.layer == "application") | "--package=" + .name')
          status=0
          # shellcheck disable=SC2086 # one argument per package
          cargo llvm-cov nextest --locked --no-tests=pass $packages --fail-under-lines 80 2> coverage.err || status=$?
          cat coverage.err >&2
          if [[ $status != 0 ]]; then
            # Crates that are still empty stubs have no instrumented code at all; that is not a
            # coverage failure. Code without tests reports 0% and fails above.
            grep -q "no coverage data found" coverage.err || exit 1
            echo "::notice::the domain and application crates have no code yet; nothing to measure"
          fi
      # Only main saves (a push or the nightly run), and only a cache it did not restore exactly:
      # PRs restore it and never evict it. Pruned first, it holds the dependencies, which change
      # only with the toolchain and Cargo.lock (tools/github/prune-target.sh).
      - if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        shell: bash
        run: tools/github/prune-target.sh
      - if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

  java-differential:
    name: HL7 Java validator differential
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      # The FHIR packages the validator loads (core, terminology, extensions), keyed on its
      # version.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.fhir/packages
          key: fhir-packages-${{ hashFiles('tools/fhir/fetch-java-validator.sh') }}
      - run: tools/fhir/fetch-r5-examples.sh
      - run: tools/fhir/java-differential.sh target/fhir/r5-examples/json
      # The core package's committed snapshots are what its FSH generates (#87; ADR 0053).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: tools/fhir/build-core-package.sh
      - name: The core package matches its sources
        run: git diff --exit-code -- packages/fhir-core-package
      # Only main saves (a push or the nightly run), and only a cache it did not restore exactly:
      # PRs restore it and never evict it. Pruned first, it holds the dependencies, which change
      # only with the toolchain and Cargo.lock (tools/github/prune-target.sh).
      - if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        shell: bash
        run: tools/github/prune-target.sh
      - if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
