# Client checks (deployment.md § Workflows; client-application.md; ADR 0054).
name: frontend-ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

# Cargo caches use actions/cache (MIT), keyed per job on the toolchain and Cargo.lock;
# Swatinem/rust-cache is LGPL-3.0, which ADR 0045's licence allowlist excludes. As rust-cache
# does, every run restores and only main saves, after tools/github/prune-target.sh leaves just the
# dependencies: PR caches would evict main's from the 10 GB the repository is allowed.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  client:
    name: install, codegen, typecheck, lint, build, bundle scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # Builds @health/design-system with `panda lib` first; the app loads it as its designSystem.
      - run: bun run codegen
      - run: bun run typecheck
      # oxlint plus the src/platform import rule (scripts/check-boundaries.ts).
      - run: bun run lint
      # Platform-layer unit tests: transports, DPoP, FhirClient, events, Query wiring.
      - run: bun run test
      # The shared FHIRPath conformance suite on fhirpath.js (#92; ADRs 0038, 0054); the same
      # fixtures run on the server's engine in rust-ci.
      - run: bun run check
        working-directory: packages/fhirpath-conformance
      - run: bun run build
      # No @tauri-apps or devtools code in the web bundle.
      - run: bun run scan

  design-system:
    name: design system lib, typecheck, lint, component and axe tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/design-system
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run lib
      - run: bun run typecheck
      - run: bun run lint
      # Component tests and axe run in Chromium (vitest browser mode), on the example page in every
      # theme and density.
      # The browser comes from Playwright's CDN. Its system libraries come from apt, but the
      # runner image already carries Chrome's, so an apt mirror outage does not fail the job; a
      # library truly missing still fails the tests.
      - run: |
          bunx playwright install chromium
          bunx playwright install-deps chromium || echo "::warning::apt is unreachable; using the runner image's libraries"
      - run: bun run test
      - run: bun run build:example

  fhir-contract:
    name: client FHIR contract, central and edge
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # Built first, so the suite's setup only starts them (health-fhir-server's contract_server
      # and health-desktop-runtime's ipc_server).
      - run: cargo build --locked -p health-fhir-server --example contract_server -p health-desktop-runtime --example ipc_server
      # The same FhirClient suite against a central (bearer), an edge (DPoP) and a desktop (IPC).
      - run: bun run test:contract
        working-directory: apps/client
      # Only main saves (a push or the nightly run), and only a cache it did not restore exactly:
      # PRs restore it and never evict it. Pruned first, it holds the dependencies, which change
      # only with the toolchain and Cargo.lock (tools/github/prune-target.sh).
      - if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        shell: bash
        run: tools/github/prune-target.sh
      - if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

  generated-types:
    name: generated FHIR and API types, typecheck, tests, drift
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # Regenerates central's OpenAPI document (cargo run -p central-server -- openapi), the
      # api-client schemas and the FHIR types, and fails when they differ from the committed ones.
      - run: bun run check
        working-directory: tools/codegen
      - run: bun run typecheck && bun run lint && bun run test
        working-directory: tools/codegen
      - run: bun run check
        working-directory: packages/fhir-types
      - run: bun run check
        working-directory: packages/api-client
      # Only main saves (a push or the nightly run), and only a cache it did not restore exactly:
      # PRs restore it and never evict it. Pruned first, it holds the dependencies, which change
      # only with the toolchain and Cargo.lock (tools/github/prune-target.sh).
      - if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        shell: bash
        run: tools/github/prune-target.sh
      - if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
