# Client checks (deployment.md § Workflows; client-application.md; ADR 0054).
name: frontend-ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

# Cargo caches use actions/cache (MIT), keyed per job on the toolchain and Cargo.lock;
# Swatinem/rust-cache is LGPL-3.0, which ADR 0045's licence allowlist excludes.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  client:
    name: install, codegen, typecheck, lint, build, bundle scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # Builds @health/design-system with `panda lib` first; the app loads it as its designSystem.
      - run: bun run codegen
      - run: bun run typecheck
      # oxlint plus the src/platform import rule (scripts/check-boundaries.ts).
      - run: bun run lint
      # Platform-layer unit tests: transports, DPoP, FhirClient, events, Query wiring.
      - run: bun run test
      - run: bun run build
      # No @tauri-apps or devtools code in the web bundle.
      - run: bun run scan

  design-system:
    name: design system lib, typecheck, lint, component and axe tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/design-system
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run lib
      - run: bun run typecheck
      - run: bun run lint
      # Component tests and axe run in Chromium (vitest browser mode), on the example page in every
      # theme and density.
      - run: bunx playwright install --with-deps chromium
      - run: bun run test
      - run: bun run build:example

  fhir-contract:
    name: client FHIR contract, central and edge
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # Built first, so the suite's setup only starts it (health-fhir-server's contract_server).
      - run: cargo build --locked -p health-fhir-server --example contract_server
      # The same FhirClient suite against a central (bearer) and an edge (DPoP) base URL.
      - run: bun run test:contract
        working-directory: apps/client

  generated-types:
    name: generated FHIR and API types, typecheck, tests, drift
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # Regenerates central's OpenAPI document (cargo run -p central-server -- openapi), the
      # api-client schemas and the FHIR types, and fails when they differ from the committed ones.
      - run: bun run check
        working-directory: tools/codegen
      - run: bun run typecheck && bun run lint && bun run test
        working-directory: tools/codegen
      - run: bun run check
        working-directory: packages/fhir-types
      - run: bun run check
        working-directory: packages/api-client
