# PR titles are Conventional Commits, since a squash merge uses the title as the commit
# subject (deployment.md § Git and merge rules).
name: pr-title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  conventional-commit:
    name: Conventional Commit title
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert)(\([a-z0-9][a-z0-9/._-]*\))?!?: [^ ].*[^.]$'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error::PR title is not a Conventional Commit: \"$TITLE\""
            echo "Expected: <type>(<optional scope>): <summary>, e.g. \"fix(fhirpath): cast FHIR primitives\"; types: feat, fix, perf, refactor, docs, test, build, ci, chore, style, revert."
            exit 1
          fi
