# The Facility Edge Node on its two platforms (deployment.md § Workflows): the edge crates'
# checks, and the binary run under the real service manager (facility-edge.md § OS service).
# On Ubuntu, pull requests run the debug binary; the release build, three times as slow from
# cold, runs on main and in the merge queue. Windows always runs the release binary: the debug
# one does not start under the SCM (its large debug futures likely overflow the service thread's
# 1 MB stack). PR builds are unsigned; release signing comes with release.yml.
name: edge-build

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Line tables keep backtraces, and the target directory and its cache small.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  windows:
    name: Windows service
    runs-on: windows-2025
    permissions:
      contents: read
    env:
      # RocksDB's bindings are generated with the image's LLVM.
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - run: cargo clippy --locked -p health-edge-runtime -p health-node-identity -p facility-edge --all-targets -- -D warnings
      - run: cargo test --locked -p health-edge-runtime -p health-node-identity
      - run: cargo build --locked --release -p facility-edge
      - name: Run it as a Windows service
        shell: pwsh
        run: |
          $store = Join-Path $env:RUNNER_TEMP 'edge\store'
          ./apps/server/facility-edge/packaging/install-service.ps1 `
            -Binary (Resolve-Path target/release/facility-edge.exe) `
            -Environment "HEALTH_DATA_DIR=$store", 'HEALTH_CONSOLE_BIND=127.0.0.1:8080'
          Start-Service facility-edge
          $deadline = (Get-Date).AddMinutes(2)
          while ($true) {
            try {
              if ((Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8080/ready).StatusCode -eq 200) { break }
            } catch {}
            if ((Get-Date) -gt $deadline) { throw 'not ready in time' }
            Start-Sleep -Seconds 1
          }
          # The node probes BitLocker itself, as LocalSystem, and reports what it found.
          $deadline = (Get-Date).AddMinutes(1)
          while ($null -eq ($status = Invoke-RestMethod http://127.0.0.1:8080/api/admin/status).encryption) {
            if ((Get-Date) -gt $deadline) { throw 'no encryption state in the status report' }
            Start-Sleep -Seconds 1
          }
          $status.encryption | ConvertTo-Json -Depth 4
          Stop-Service facility-edge
          $service = Get-CimInstance Win32_Service -Filter "Name='facility-edge'"
          "state=$($service.State) exit=$($service.ExitCode) specific=$($service.ServiceSpecificExitCode)"
          if ($service.State -ne 'Stopped' -or $service.ExitCode -ne 0 -or $service.ServiceSpecificExitCode -ne 0) {
            throw 'the service did not stop cleanly'
          }
      # Only main saves (a push or the nightly run), and only a cache it did not restore exactly:
      # PRs restore it and never evict it. Pruned first, it holds the dependencies, which change
      # only with the toolchain and Cargo.lock (tools/github/prune-target.sh).
      - if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        shell: bash
        run: tools/github/prune-target.sh
      - if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

  linux:
    name: systemd service
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      # The web app first, so the binary embeds it (#76).
      - run: bun install --frozen-lockfile
      - run: bun run codegen && bun run build
        working-directory: apps/client
      - run: cargo build --locked -p facility-edge -p pki
      - if: github.event_name != 'pull_request'
        run: cargo build --locked --release -p facility-edge -p pki
      - name: Run it under systemd
        run: |
          sudo useradd --system --no-create-home health
          sudo install -D -m 0755 target/debug/facility-edge /opt/health/bin/facility-edge
          sudo install -d /etc/health
          # The runner is not encrypted, so provisioning needs an exemption.
          printf 'HEALTH_DATA_DIR=/var/lib/health/store\nHEALTH_BIND=127.0.0.1:8443\nHEALTH_ENCRYPTION_EXEMPTION=ci-runner\n' \
            | sudo tee /etc/health/facility-edge.env
          sudo install -m 0644 apps/server/facility-edge/packaging/facility-edge.service \
            apps/server/facility-edge/packaging/facility-edge-rollback.service /etc/systemd/system/
          sudo systemd-analyze verify /etc/systemd/system/facility-edge.service
          # Provision: the edge seals its key with systemd-creds and requests its intermediate,
          # a test PKI issues it, and the edge installs the chain.
          edge() { sudo bash -c 'set -a; . /etc/health/facility-edge.env; exec /opt/health/bin/facility-edge "$@"' edge "$@"; }
          pki=target/debug/pki
          edge provision request --out "$RUNNER_TEMP/request.pem"
          sudo test -f /etc/credstore.encrypted/health.facility-intermediate.key
          # And the local authorization server's pepper and token-signing keys (#75).
          sudo test -f /etc/credstore.encrypted/health.pepper.key
          sudo test -f /etc/credstore.encrypted/health.token-signing.key
          $pki root --name 'CI Root' --out "$RUNNER_TEMP/root"
          $pki request --name issuing --out "$RUNNER_TEMP/issuing"
          $pki issuing-ca --ca "$RUNNER_TEMP/root" --request "$RUNNER_TEMP/issuing/request.pem" \
            --name 'CI Issuing CA' --suffixes example.ug --out "$RUNNER_TEMP/issuing/certificate.pem"
          echo '{"number":0,"revoked":[]}' > "$RUNNER_TEMP/issuing/revocations.json"
          $pki facility --ca "$RUNNER_TEMP/issuing" --request "$RUNNER_TEMP/request.pem" \
            --node-id facility-edge --out "$RUNNER_TEMP/facility.pem"
          cat "$RUNNER_TEMP/facility.pem" "$RUNNER_TEMP/issuing/certificate.pem" > "$RUNNER_TEMP/chain.pem"
          edge provision install --chain "$RUNNER_TEMP/chain.pem" --root "$RUNNER_TEMP/root/certificate.pem"
          edge provision status
          sudo systemctl daemon-reload
          # Type=notify: start returns once the edge has migrated and sent READY=1.
          sudo systemctl start facility-edge
          # Provisioned, it serves HTTPS with a leaf it issued under its intermediate, which a
          # client trusting only the root accepts for facility-edge.local, and no plain HTTP on
          # the LAN listener.
          https() {
            curl --fail --silent --cacert "$RUNNER_TEMP/root/certificate.pem" \
              --resolve facility-edge.local:8443:127.0.0.1 "https://facility-edge.local:8443$1"
          }
          https /ready
          if curl --silent --max-time 5 http://127.0.0.1:8443/ready; then
            echo 'plain HTTP answered on the LAN listener'; exit 1
          fi
          # The edge's own screen keeps its plain-HTTP console on the loopback address.
          curl --fail --silent http://127.0.0.1:8080/ready
          curl --fail --silent --output /dev/null http://127.0.0.1:8080/api/admin/status
          # The pairing payload pins the installed intermediate's key, as openssl computes it.
          pin="sha256/$(openssl x509 -in "$RUNNER_TEMP/facility.pem" -pubkey -noout \
            | openssl pkey -pubin -outform der | openssl dgst -sha256 -binary | base64)"
          curl --fail --silent http://127.0.0.1:8080/api/admin/pairing > pairing.json
          cat pairing.json
          grep --quiet "\"spki\":\"$pin\"" pairing.json
          grep --quiet '"uri":"health-edge://pair?v=1&node=facility-edge&' pairing.json
          sudo test -f /var/lib/health/tls/leaf.pem
          test "$(sudo stat -c %a /var/lib/health/tls/leaf.key)" = 600
          # The embedded app: the page, its runtime.json and the shell's service worker.
          https / | grep --quiet 'id="root"'
          https /runtime.json | grep --quiet '"mode":"edge"'
          https /sw.js > /dev/null
          # The root probe ran before the start, and the node reports its result.
          sudo cat /run/health/encryption.json
          for _ in $(seq 30); do
            https /api/admin/status > status.json
            grep --quiet '"encryption":{' status.json && break
            sleep 1
          done
          grep --quiet '"certificate":{"state":"serving"' status.json
          grep --quiet '"encryption":{' status.json
          grep --only-matching '"encryption":{[^]]*]' status.json
          # systemd unsealed the key for the unprivileged service.
          sudo journalctl -u facility-edge --no-pager | grep --quiet identity-loaded
          sudo systemctl stop facility-edge
          systemctl show facility-edge -p Result -p ExecMainStatus
          test "$(systemctl show facility-edge -p Result --value)" = success
          test "$(systemctl show facility-edge -p ExecMainStatus --value)" = 0
      - if: failure()
        run: sudo journalctl -u facility-edge --no-pager
      # Only main saves (a push or the nightly run), and only a cache it did not restore exactly:
      # PRs restore it and never evict it. Pruned first, it holds the dependencies, which change
      # only with the toolchain and Cargo.lock (tools/github/prune-target.sh).
      - if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        shell: bash
        run: tools/github/prune-target.sh
      - if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
