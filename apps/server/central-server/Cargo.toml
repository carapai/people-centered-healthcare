[package]
name = "central-server"
description = "Central server composition root (ADR 0001)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.health]
layer = "runtime"

[lints]
workspace = true

[dependencies]
axum = { workspace = true }
