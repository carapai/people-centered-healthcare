health-audit = { workspace = true }
health-auth = { workspace = true }
health-client-registry = { workspace = true }
health-fhir-search = { workspace = true }
health-fhir-server = { workspace = true }
health-http = { workspace = true }
health-identifiers = { workspace = true }
health-identity = { workspace = true }
health-observability = { workspace = true }
health-registries-app = { workspace = true }
health-surrealdb = { workspace = true, features = ["remote"] }
health-time = { workspace = true }
jiff = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tower = { workspace = true }
tokio = { workspace = true, features = ["net", "signal", "sync"] }
tracing = { workspace = true }
utoipa = { workspace = true }

[dev-dependencies]
form_urlencoded = { workspace = true }
health-surrealdb = { workspace = true, features = ["remote"] }
