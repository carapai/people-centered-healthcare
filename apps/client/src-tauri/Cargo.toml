# The Tauri desktop client (desktop-client.md; ADRs 0039–0041). Its own workspace: Tauri needs
# WebKitGTK to build on Linux, which the main workspace's jobs do not install. It depends on the
# main workspace's crates by path; `desktop.yml` builds, lints and checks it.
[workspace]

[package]
name = "health-desktop"
description = "The Tauri desktop client: the webview over health-desktop-runtime (desktop-client.md)."
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "Apache-2.0"

[package.metadata.health]
layer = "runtime"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "matched-path", "tokio"] }
health-backup = { path = "../../../crates/infrastructure/health-backup" }
health-authority-leases = { path = "../../../crates/domains/health-authority-leases" }
health-auth = { path = "../../../crates/infrastructure/health-auth" }
health-activation = { path = "../../../crates/infrastructure/health-activation" }
health-configuration = { path = "../../../crates/domains/health-configuration" }
health-desktop-runtime = { path = "../../../crates/desktop/health-desktop-runtime" }
health-fhir-server = { path = "../../../crates/infrastructure/health-fhir-server" }
health-files = { path = "../../../crates/infrastructure/health-files" }
health-http = { path = "../../../crates/infrastructure/health-http" }
health-identity = { path = "../../../crates/domains/health-identity" }
health-node-api = { path = "../../../crates/infrastructure/health-node-api" }
health-node-identity = { path = "../../../crates/edge/health-node-identity" }
health-pki = { path = "../../../crates/infrastructure/health-pki" }
health-sync-client = { path = "../../../crates/infrastructure/health-sync-client" }
health-surrealdb = { path = "../../../crates/infrastructure/health-surrealdb", features = ["embedded"] }
health-time = { path = "../../../crates/foundation/health-time" }
base64 = "0.22.1"
form_urlencoded = "1.2.2"
keyring = "=4.2.0"
p256 = { version = "0.13.2", features = ["ecdsa", "jwk", "pkcs8", "pem"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tauri = { version = "=2.12.5", default-features = false, features = ["wry", "compression"] }
tauri-plugin-single-instance = "=2.5.4"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
health-surrealdb = { path = "../../../crates/infrastructure/health-surrealdb", features = ["embedded", "memory"] }
tempfile = "3.27.0"
uuid = { version = "1.29.0", features = ["serde", "v5", "v7"] }

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

# The main workspace's lints.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
print_stdout = "warn"

# The main workspace's patches: a separate workspace does not inherit them, and without them the
# desktop would build the unpatched crates (ADR 0052).
[patch.crates-io]
octofhir-fhirpath = { path = "../../../third_party/octofhir-fhirpath" }
octofhir-ucum = { path = "../../../third_party/octofhir-ucum" }
