# cargo-deny policy (ADR 0045).

[graph]
all-features = true

[advisories]
yanked = "deny"
# Transitive through SurrealDB 3.3.5, with no semver-compatible fix. Each is reviewed on every
# SurrealDB bump and removed as soon as the bump clears it (reviewed in #55).
ignore = [
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 via jsonwebtoken in SurrealDB's own JWT access methods, which we do not use; fix needs 0.7" },
    { id = "RUSTSEC-2023-0071", reason = "rsa Marvin attack via jsonwebtoken in SurrealDB's JWT access methods, which we do not use; no fixed release" },
    { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.39 via object_store for SurrealDB buckets, which we do not use; fix needs 0.41" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.39 via object_store for SurrealDB buckets, which we do not use; fix needs 0.41" },
    { id = "RUSTSEC-2025-0141", reason = "bincode unmaintained, via surrealmx in the in-memory engine used only by tests" },
]

[licenses]
confidence-threshold = 0.9
# The allowlist is policy, not a record of what is in use today.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]

# Workspace crates are unpublished (publish = false) and need no licence.
[licenses.private]
ignore = true

# SurrealDB's Business Source License 1.1 is a documented exception (ADR 0045). The SurrealDB
# crates ship the BSL text as LICENSE without a licence field, so each is clarified against that
# file's hash (a changed licence text fails the check) and only these crates may be BUSL-1.1.
[[licenses.clarify]]
crate = "surrealdb"
expression = "BUSL-1.1"
license-files = [{ path = "LICENSE", hash = 0xbb1191d7 }]

