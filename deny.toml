crate = "ext-sort" # pulled in by surrealdb-core
allow = ["Unlicense"]

[[licenses.exceptions]]
crate = "webpki-roots" # Mozilla CA bundle, used by rustls for the remote engine
allow = ["CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates are unpublished path dependencies (publish = false).
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
